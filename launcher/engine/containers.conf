# Session engine defaults (design D3). They replace the base image's
# containers.conf, which shares the engine's namespaces with nested containers
# and disables cgroups. Nested containers get private namespaces, UTS
# included: the engine's seccomp profile allows sethostname (design D4).
[containers]
# Readable `podman logs`; the base image's vendor drop-in selects journald.
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
